apiVersion: modelhub.api-platform.wso2.com/v1alpha1
kind: ProviderDefinition
metadata:
  name: awsbedrock
  version: "1.0"
spec:
  displayName: AWS Bedrock
  description: Models hosted on Amazon Bedrock through the Converse and InvokeModel APIs.
  wireFormat: bedrock
  hosting: hosted
  auth:
    type: apiKey
    header: Authorization
    valuePrefix: 'Bearer '
  links:
    logoUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/awsbedrock/icon.png
    openapiSpecUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/awsbedrock/openapi.yaml
  template:
    groupId: wso2-awsbedrock
    managedBy: wso2
    version: v1.0
    promptTokens:
      location: payload
      identifier: $.usage.inputTokens
      fallbackIdentifiers:
        - $.usage.input_tokens
        - $.message.usage.input_tokens
        - $.usage.prompt_tokens
        - $.inputTextTokenCount
    completionTokens:
      location: payload
      identifier: $.usage.outputTokens
      fallbackIdentifiers:
        - $.usage.output_tokens
        - $.usage.completion_tokens
        - $.results[0].tokenCount
    totalTokens:
      location: payload
      identifier: $.usage.totalTokens
    requestModel:
      location: pathParam
      identifier: model/([A-Za-z0-9.:%-]+)/
    responseModel:
      location: pathParam
      identifier: model/([A-Za-z0-9.:%-]+)/
    cachedTokens:
      location: payload
      identifier: $.usage.cacheReadInputTokens
      fallbackIdentifiers:
        - $.usage.cache_read_input_tokens
        - $.usage.prompt_tokens_details.cached_tokens
    cacheWriteTokens:
      location: payload
      identifier: $.usage.cacheWriteInputTokens
      fallbackIdentifiers:
        - $.usage.cache_creation_input_tokens
        - $.usage.prompt_tokens_details.cache_write_tokens
    serviceTier:
      location: payload
      identifier: $.serviceTier.type
      valueMap:
        flex: flex
        priority: priority
    providerFields:
      cacheDetails:
        location: payload
        identifier: $.usage.cacheDetails
    cacheAccounting: additive
