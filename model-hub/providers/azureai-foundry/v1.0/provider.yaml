apiVersion: modelhub.api-platform.wso2.com/v1alpha1
kind: ProviderDefinition
metadata:
  name: azureai-foundry
  version: "1.0"
spec:
  displayName: Azure AI Foundry
  description: Models deployed in Azure AI Foundry.
  wireFormat: azure-ai-foundry
  hosting: hosted
  auth:
    type: apiKey
    header: api-key
  links:
    logoUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/azureai-foundry/icon.png
    openapiSpecUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/azureai-foundry/openapi.yaml
  template:
    groupId: wso2-azureai-foundry
    managedBy: wso2
    version: v1.0
    promptTokens:
      location: payload
      identifier: $.usage.prompt_tokens
    completionTokens:
      location: payload
      identifier: $.usage.completion_tokens
    totalTokens:
      location: payload
      identifier: $.usage.total_tokens
      fallbackIdentifiers:
        - $.response.usage.total_tokens
    remainingTokens:
      location: header
      identifier: x-ratelimit-remaining-tokens
    requestModel:
      location: payload
      identifier: $.model
    responseModel:
      location: payload
      identifier: $.model
      fallbackIdentifiers:
        - $.response.model
    cachedTokens:
      location: payload
      identifier: $.usage.prompt_tokens_details.cached_tokens
      fallbackIdentifiers:
        - $.usage.prompt_token_details.cached_tokens
    reasoningTokens:
      location: payload
      identifier: $.usage.completion_tokens_details.reasoning_tokens
    audioInputTokens:
      location: payload
      identifier: $.usage.prompt_tokens_details.audio_tokens
    audioOutputTokens:
      location: payload
      identifier: $.usage.completion_tokens_details.audio_tokens
    serviceTier:
      location: payload
      identifier: $.service_tier
      fallbackIdentifiers:
        - $.response.service_tier
      valueMap:
        priority: priority
    cacheAccounting: inclusive
    resourceMappings:
      resources:
        - resource: /responses
          promptTokens:
            location: payload
            identifier: $.usage.input_tokens
            fallbackIdentifiers:
              - $.response.usage.input_tokens
          completionTokens:
            location: payload
            identifier: $.usage.output_tokens
            fallbackIdentifiers:
              - $.response.usage.output_tokens
          cachedTokens:
            location: payload
            identifier: $.usage.input_tokens_details.cached_tokens
            fallbackIdentifiers:
              - $.response.usage.input_tokens_details.cached_tokens
          reasoningTokens:
            location: payload
            identifier: $.usage.output_tokens_details.reasoning_tokens
            fallbackIdentifiers:
              - $.response.usage.output_tokens_details.reasoning_tokens
