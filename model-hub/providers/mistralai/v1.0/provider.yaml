apiVersion: modelhub.api-platform.wso2.com/v1alpha1
kind: ProviderDefinition
metadata:
  name: mistralai
  version: "1.0"
spec:
  displayName: MistralAI
  description: Mistral AI's hosted models.
  wireFormat: mistral
  hosting: hosted
  defaultUrl: https://api.mistral.ai
  auth:
    type: apiKey
    header: Authorization
    valuePrefix: 'Bearer '
  links:
    logoUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/mistral/icon.png
    openapiSpecUrl: https://raw.githubusercontent.com/wso2/api-platform/main/llm-provider-specs/mistral/openapi.yaml
  template:
    groupId: wso2-mistralai
    managedBy: wso2
    version: v1.0
    promptTokens:
      location: payload
      identifier: $.usage.prompt_tokens
    completionTokens:
      location: payload
      identifier: $.usage.completion_tokens
    totalTokens:
      location: payload
      identifier: $.usage.total_tokens
    remainingTokens:
      location: header
      identifier: x-ratelimit-remaining-tokens
    requestModel:
      location: payload
      identifier: $.model
    responseModel:
      location: payload
      identifier: $.model
    providerFields:
      promptAudioSeconds:
        location: payload
        identifier: $.usage.prompt_audio_seconds
    cacheAccounting: inclusive
