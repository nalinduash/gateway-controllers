# vLLM serves an OpenAI-compatible API, so it needs no transformer policy: the
# definition reuses the OpenAI wire format and its usage fields. The server runs
# in the user's own network, so there is no default URL; the user supplies it.
apiVersion: modelhub.api-platform.wso2.com/v1alpha1
kind: ProviderDefinition
metadata:
  name: vllm
  version: "1.0"
spec:
  displayName: vLLM
  description: A self-hosted vLLM inference server, reached through its OpenAI-compatible API.
  wireFormat: openai
  hosting: self-hosted
  # Sent only when the server is started with --api-key.
  auth:
    type: apiKey
    header: Authorization
    valuePrefix: 'Bearer '
  template:
    groupId: wso2-vllm
    managedBy: wso2
    version: v1.0
    promptTokens:
      location: payload
      identifier: $.usage.prompt_tokens
    completionTokens:
      location: payload
      identifier: $.usage.completion_tokens
    totalTokens:
      location: payload
      identifier: $.usage.total_tokens
    requestModel:
      location: payload
      identifier: $.model
    responseModel:
      location: payload
      identifier: $.model
    cacheAccounting: inclusive
